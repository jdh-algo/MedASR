[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medasr-server"
version = "0.1.0"
description = "Low-latency, concurrent speech recognition server for long sessions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi==0.135.2",
  "httpx==0.28.1",
  "librosa==0.11.0",
  "numpy==2.2.6",
  "PyYAML==6.0.3",
  "soundfile==0.14.0",
  "starlette==0.52.1",
  "uvicorn[standard]==0.42.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
gpu = [
  "gradio==5.50.0",
  "qwen-asr==0.0.6",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "torchvision==0.25.0",
  "transformers==4.57.6",
  "vllm==0.18.0",
]
vad = ["funasr==1.3.26"]

[tool.setuptools.packages.find]
include = ["asrsvc*"]
